@if(isLoading){
  <app-loading></app-loading>
}

<div class="content">

  <div class="content-title">
    Termos de Uso
  </div>

  <div class="content-text">
    <pre class="term-text">{{ term }}</pre>
  </div>

  <div class="content-bottom">
    <button class="content-button" (click)="validateCode()" [disabled]="isLoading">
      <mat-icon>send</mat-icon> Concordar e Concluir
    </button>
  </div>

</div>

<!-- Dialog -->
<div class="dialog-overlay" *ngIf="showDialog" (click)="closeDialog()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <pre>{{ dialogMessage }}</pre>
    <button (click)="closeDialog()">Fechar</button>
  </div>
</div>
