@if(isLoading){
  <app-loading></app-loading>
}
<div class="content">
  <div class="content-title-container">
    <button mat-icon-button class="back-button" (click)="updateVisible(1)">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <div class="content-title">Informe o seu CPF e Data de Nascimento</div>
  </div>
  <div class="content-image">
    <img src="assets/images/smiling.png" alt="imagem" />
  </div>

  <form class="content-form" [formGroup]="form" (submit)="$event.preventDefault()">
    <div class="content-input">
      <div class="input-wrapper" [class.focused]="focused['cpf'] || form.get('cpf')?.value">
        <label>CPF</label>
        <input #cpfInput type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" formControlName="cpf" (input)="onCpfInput($event)" (focus)="onFocus('cpf')" (blur)="onBlur('cpf')" />
      </div>
    </div>

    <div class="content-input">
      <div #dateWrapper class="input-wrapper date-wrapper" [class.focused]="focused['birth_date'] || form.get('birth_date')?.value">
        <label>Data de Nascimento</label>
        <input #dateInput type="text" [value]="dateDisplay"
               (input)="onDateInput($event)" (click)="openCalendar()"
               (focus)="onFocus('birth_date')" (blur)="onDateBlur()"
               style="cursor:text" autocomplete="bday" />
        <button type="button" class="icon-btn" aria-label="Abrir calendário"
                (mousedown)="$event.preventDefault()" (click)="openCalendar()">
          <mat-icon>calendar_month</mat-icon>
        </button>

        <div *ngIf="calendarOpen" #calendar class="calendar-popup"
             (mousedown)="$event.preventDefault()"
             (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)">
          <div class="cal-header">
            <button class="cal-arrow" type="button" (click)="prevMonth()"><mat-icon>chevron_left</mat-icon></button>
            <div class="cal-title">{{ monthsPt[calMonth] }} {{ calYear }}</div>
            <button class="cal-arrow" type="button" (click)="nextMonth()"><mat-icon>chevron_right</mat-icon></button>
          </div>

          <div class="cal-grid">
            <div class="cal-weekday" *ngFor="let weekday of weekdaysPt">{{ weekday }}</div>
            <ng-container *ngFor="let week of weeks">
              <ng-container *ngFor="let cell of week">
                <button type="button" class="cal-cell" [class.other]="!cell.currentMonth"
                        [class.today]="isToday(cell.d)"
                        [class.selected]="selectedDateObj() && cell.d && selectedDateObj()!.toDateString() === cell.d.toDateString()"
                        (click)="cell.d && pickDate(cell.d)">
                  <span>{{ cell.d ? cell.d.getDate() : '' }}</span>
                </button>
              </ng-container>
            </ng-container>
          </div>
        </div>
      </div>
    </div>
  </form>

  <div class="content-bottom">
    <button class="content-button" (click)="validateCpf()">
      <mat-icon>arrow_forward</mat-icon> Avançar
    </button>
  </div>
</div>

<div class="dialog-overlay" *ngIf="showDialog" (click)="closeDialog()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <pre>{{ dialogMessage }}</pre>
    <button (click)="closeDialog()">Fechar</button>
  </div>
</div>
